name: CI

on:
  pull_request:
    paths:
      - "oss/sdk-js/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oss/sdk-js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: oss/sdk-js/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
